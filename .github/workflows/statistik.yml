name: Uppdatera statistik

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: statistik
  cancel-in-progress: false

jobs:
  uppdatera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Hämta statistik från Steam
        run: node scripts/hamta-statistik.mjs
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
          FACEIT_API_KEY: ${{ secrets.FACEIT_API_KEY }}
          FACEIT_NICKNAME: ${{ secrets.FACEIT_NICKNAME }}
          LEETIFY_API_KEY: ${{ secrets.LEETIFY_API_KEY }}

      - name: Spara den nya statistiken
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet || (git commit -m "Uppdatera statistik" && git push)
